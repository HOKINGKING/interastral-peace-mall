<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="side(active)" class="admin-side">
    <div class="logo-row">
        <img class="ipc-logo" th:src="@{/img/ipc-logo-light.png}" alt="星际和平公司标识">
        <span>星际和平商城</span>
    </div>
    <div class="group">工作台</div>
    <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active' : ''">工作台</a>
    <div class="group">业务模块</div>
    <a th:href="@{/admin/category}" th:classappend="${active == 'category'} ? 'active' : ''">分类管理</a>
    <a th:href="@{/admin/product}" th:classappend="${active == 'product' or active == 'item'} ? 'active' : ''">商品管理</a>
    <a th:href="@{/admin/order}" th:classappend="${active == 'order'} ? 'active' : ''">订单管理</a>
    <a th:href="@{/admin/feedback}" th:classappend="${active == 'feedback'} ? 'active' : ''">投诉与反馈</a>
    <a th:href="@{/admin/account}" th:classappend="${active == 'account'} ? 'active' : ''">用户管理</a>
    <a th:href="@{/admin/log}" th:classappend="${active == 'log'} ? 'active' : ''">操作日志</a>
</aside>
</body>
</html>
