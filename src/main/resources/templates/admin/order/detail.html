<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/head :: head(${pageTitle})}"></head>
<body class="admin">
<div th:replace="~{admin/fragments/side :: side('order')}"></div>

<div class="admin-main">
    <div th:replace="~{admin/fragments/top :: top('订单管理 / 订单详情')}"></div>

    <div class="admin-body">
        <div class="panel pad mb-16" th:if="${listMessage != null}" th:text="${listMessage}">提示</div>

        <div class="panel pad mb-16">
            <div class="between wrap">
                <div>
                    <div class="row">
                        <h2 style="font-size:18px" th:text="|订单 ${order.orderNo}|">订单</h2>
                        <span class="badge" th:classappend="${order.statusClass}" th:text="${order.statusDesc}">已支付</span>
                    </div>
                    <div class="small muted mt-8">
                        用户 <b th:text="${order.username != null ? order.username : '—'}">xingye</b>
                        · 下单时间 <span th:text="${order.createTimeText}">2026-11-17 20:15:01</span>
                    </div>
                </div>
                <div class="row wrap" style="gap:8px">
                    <a class="btn btn-sm" th:href="@{/admin/order}">返回列表</a>
                    <button class="btn btn-sm btn-danger" type="button"
                            th:if="${order.canDelete}" th:attr="data-delete-order=${order.id}">删除订单</button>
                </div>
            </div>
        </div>

        <div class="row" style="align-items:flex-start;gap:20px">
            <div class="content-main">
                <!-- 时间线 -->
                <div class="panel pad">
                    <b>状态时间线</b>
                    <div class="timeline mt-16">
                        <div class="item" th:each="node : ${order.timeline}"
                             th:classappend="${node.done} ? 'done' : ''">
                            <div class="t" th:text="${node.label}">已提交订单</div>
                            <div class="d" th:text="${node.timeText}">2026-11-16 10:21:00</div>
                        </div>
                    </div>
                </div>

                <!-- 商品明细 -->
                <div class="panel mt-16">
                    <div class="pad-sm" style="border-bottom:1px solid var(--line)"><b>商品明细（快照，锁定）</b></div>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>商品</th>
                            <th>单价</th>
                            <th>数量</th>
                            <th class="right">小计</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.items}">
                            <td>
                                <div class="row">
                                    <span class="ph" style="width:44px;height:44px;font-size:16px;flex:0 0 44px"
                                          th:if="${item.image == null}"
                                          th:text="${#strings.substring(item.productName, 0, 1)}">星</span>
                                    <img th:if="${item.image != null}" th:src="${item.image}"
                                         th:alt="${item.productName}"
                                         style="width:44px;height:44px;border-radius:8px;object-fit:cover">
                                    <div>
                                        <span th:text="${item.productName}">商品名</span>
                                        <div class="small muted" th:if="${item.spec != null}"
                                             th:text="${item.spec}">规格</div>
                                    </div>
                                </div>
                            </td>
                            <td th:text="|¥${item.priceText}|">¥0.00</td>
                            <td th:text="${item.quantity}">1</td>
                            <td class="right" th:text="|¥${item.subtotalText}|">¥0.00</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 收货信息 + 修改 -->
                <div class="panel pad mt-16">
                    <div class="between">
                        <b>收货信息</b>
                        <span class="small muted" th:text="${order.receiverName + ' · ' + order.receiverPhoneMasked}">星野</span>
                    </div>
                    <div class="small muted mt-8" th:text="${order.receiverAddress}">地址</div>

                    <form class="mt-16" th:action="@{/admin/order/{id}/receiver(id=${order.id})}"
                          data-admin-form th:attr="data-redirect=|/admin/order/${order.id}|">
                        <div class="grid-2">
                            <div class="field">
                                <label>收货人</label>
                                <input class="input" type="text" name="receiverName" maxlength="20"
                                       th:value="${order.receiverName}">
                            </div>
                            <div class="field">
                                <label>手机号</label>
                                <input class="input" type="tel" name="receiverPhone" maxlength="11"
                                       th:value="${order.receiverPhoneRaw}">
                            </div>
                        </div>
                        <div class="field">
                            <label>详细地址</label>
                            <input class="input" type="text" name="receiverDetail" maxlength="100"
                                   th:value="${order.receiverDetail}">
                            <div class="help" th:text="|省市区沿用快照：${order.receiverProvince != null ? order.receiverProvince : ''} ${order.receiverCity != null ? order.receiverCity : ''} ${order.receiverDistrict != null ? order.receiverDistrict : ''}|">省市区</div>
                        </div>
                        <div class="field">
                            <label>订单备注</label>
                            <input class="input" type="text" name="remark" maxlength="200"
                                   th:value="${order.remark}" placeholder="选填，≤200 字">
                        </div>
                        <button class="btn btn-sm btn-primary" type="submit">保存收货信息</button>
                    </form>
                </div>
            </div>

            <aside style="width:320px;flex:0 0 320px">
                <!-- 发货 -->
                <div class="panel pad" th:if="${order.status == 'PAID'}">
                    <b>发货</b>
                    <p class="small muted mt-8">填写物流信息后订单变为「已发货」，买家可确认收货。</p>
                    <form class="mt-16" th:action="@{/admin/order/{id}/ship(id=${order.id})}"
                          data-admin-form th:attr="data-redirect=|/admin/order/${order.id}|">
                        <div class="field">
                            <label>物流公司<span class="req">*</span></label>
                            <input class="input" type="text" name="courierCompany" maxlength="30"
                                   placeholder="如：星际速运">
                        </div>
                        <div class="field">
                            <label>物流单号<span class="req">*</span></label>
                            <input class="input" type="text" name="trackingNo" maxlength="40"
                                   placeholder="如：IPC202611170002">
                        </div>
                        <button class="btn btn-primary btn-block" type="submit">确认发货</button>
                    </form>
                </div>

                <!-- 物流 -->
                <div class="panel pad mt-16" th:if="${order.trackingNo != null}">
                    <b>物流信息</b>
                    <div class="divider"></div>
                    <div class="small" th:text="${order.courierCompany}">星际速运</div>
                    <div class="small mono mt-8" th:text="${order.trackingNo}">IPC202611160001</div>
                </div>

                <!-- 金额 -->
                <div class="panel pad mt-16">
                    <b>金额</b>
                    <div class="divider"></div>
                    <div class="between small">
                        <span class="muted">商品总额</span>
                        <span th:text="|¥${order.goodsAmountText}|">¥0.00</span>
                    </div>
                    <div class="between small mt-8">
                        <span class="muted">运费</span>
                        <span th:text="|¥${order.freightAmountText}|">¥0.00</span>
                    </div>
                    <div class="between mt-8">
                        <span>应付</span>
                        <span class="total-amount" th:text="|¥${order.totalAmountText}|">¥0.00</span>
                    </div>
                </div>

                <div class="panel pad mt-16">
                    <b>订单操作</b>
                    <p class="small muted mt-8">金额与商品明细为下单快照，不可修改；只有终态（已完成/已取消）订单可删除。</p>
                </div>
            </aside>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
