<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/head :: head(${pageTitle})}"></head>
<body class="admin">
<div th:replace="~{admin/fragments/side :: side('category')}"></div>

<div class="admin-main">
    <div th:replace="~{admin/fragments/top :: top('分类管理')}"></div>

    <div class="admin-body">
        <div class="page-title">
            <div>
                <h1>分类管理</h1>
                <p>两级分类：一级用于前台导航，二级用于商品归属；有子分类或商品时不能删除</p>
            </div>
            <div class="row">
                <a class="btn btn-primary btn-sm" th:href="@{/admin/category/form}">+ 新增分类</a>
            </div>
        </div>

        <div class="panel pad mb-16" th:if="${listMessage != null}" th:text="${listMessage}">提示</div>

        <div class="panel">
            <div class="filter-bar" style="border-bottom:1px solid var(--line)">
                <form method="get" th:action="@{/admin/category}" class="row" style="gap:8px;margin:0">
                    <input class="input" style="width:220px;height:32px" type="search" name="keyword"
                           th:value="${keyword}" placeholder="按分类名称搜索" maxlength="30">
                    <button class="btn btn-sm" type="submit">搜索</button>
                    <a class="btn btn-sm" th:if="${keyword != null and keyword != ''}"
                       th:href="@{/admin/category}">清空</a>
                </form>
                <span style="flex:1"></span>
                <span class="small muted" th:text="|共 ${#lists.size(categories)} 条|">共 0 条</span>
            </div>

            <table class="table" th:if="${!#lists.isEmpty(categories)}">
                <thead>
                <tr>
                    <th>名称</th>
                    <th>层级</th>
                    <th>描述</th>
                    <th>排序</th>
                    <th>商品数</th>
                    <th>前台可见</th>
                    <th>更新时间</th>
                    <th class="right">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categories}" th:attr="data-category-id=${cat.id}">
                    <td th:style="${cat.root} ? '' : 'padding-left:32px'">
                        <b th:if="${cat.root}" th:text="${cat.name}">一级分类</b>
                        <span th:unless="${cat.root}" th:text="|— ${cat.name}|">— 二级分类</span>
                    </td>
                    <td>
                        <span class="badge" th:text="${cat.root} ? '一级' : '二级'">一级</span>
                    </td>
                    <td class="muted small" th:text="${cat.descn}">描述</td>
                    <td th:text="${cat.sort}">0</td>
                    <td>
                        <span th:text="${cat.productCount}">0</span>
                        <span class="small muted" th:if="${cat.root and cat.childCount > 0}"
                              th:text="|· ${cat.childCount} 个子分类|">· 0 个子分类</span>
                    </td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" th:checked="${cat.visible}" disabled>
                            <span></span>
                        </label>
                    </td>
                    <td class="small muted" th:text="${cat.updateTimeText}">2026-11-12 10:00</td>
                    <td class="right">
                        <div class="actions">
                            <a class="btn btn-sm" th:href="@{/admin/category/form/{id}(id=${cat.id})}">编辑</a>
                            <button class="btn btn-sm btn-danger" type="button"
                                    th:attr="data-delete-category=${cat.id},data-category-name=${cat.name}">删除</button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="empty" th:if="${#lists.isEmpty(categories)}">
                <div class="icon">🗂️</div>
                <div>没有匹配的分类</div>
                <div class="small muted mt-8">换个关键词，或直接新增一个分类</div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
