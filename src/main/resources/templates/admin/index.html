<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 · 星际和平商城</title>
    <link rel="icon" th:href="@{/img/ipc-logo-dark.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="admin">
<aside class="admin-side">
    <div class="logo-row">
        <img class="ipc-logo" th:src="@{/img/ipc-logo-light.png}" alt="星际和平公司标识">
        <span>星际和平商城</span>
    </div>
    <div class="group">工作台</div>
    <a class="active" th:href="@{/admin}">工作台</a>
    <div class="group">业务模块</div>
    <span class="admin-nav-disabled">商品管理 · 待接入</span>
    <span class="admin-nav-disabled">订单管理 · 待接入</span>
    <span class="admin-nav-disabled">用户管理 · 待接入</span>
    <span class="admin-nav-disabled">操作日志 · 待接入</span>
</aside>

<div class="admin-main">
    <div class="admin-top">
        <div class="crumb">工作台</div>
        <div class="admin-user">
            <span class="avatar"
                  th:text="${#strings.substring(session.LOGIN_ADMIN.displayName, 0, 1)}">管</span>
            <span th:text="${session.LOGIN_ADMIN.displayName}">管理员</span>
            <form class="inline-form" th:action="@{/admin/logout}" method="post">
                <button class="link-btn" type="submit">退出</button>
            </form>
        </div>
    </div>

    <div class="admin-body">
        <div class="page-title">
            <div>
                <h1>工作台</h1>
                <p>后台认证已就绪，业务模块将在后续里程碑接入。</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="k">今日订单</div>
                <div class="v">—</div>
            </div>
            <div class="stat">
                <div class="k">待发货</div>
                <div class="v">—</div>
            </div>
            <div class="stat">
                <div class="k">在售商品</div>
                <div class="v">—</div>
            </div>
            <div class="stat">
                <div class="k">注册用户</div>
                <div class="v">—</div>
            </div>
        </div>

        <div class="panel pad mt-24">
            <h3>后台占位页</h3>
            <p class="muted mt-8">
                当前已完成后台登录、验证码、会话隔离与退出。分类、商品、订单、用户、售后和操作日志页面将在 M6 接入。
            </p>
            <div class="row mt-16">
                <a class="btn" th:href="@{/}">返回前台</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
