<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/head :: head('工作台')}"></head>
<body class="admin">
<div th:replace="~{admin/fragments/side :: side('dashboard')}"></div>

<div class="admin-main">
    <div th:replace="~{admin/fragments/top :: top('工作台')}"></div>

    <div class="admin-body">
        <div class="page-title">
            <div>
                <h1>工作台</h1>
                <p>后台认证、分类管理与商品管理已就绪，其余业务模块将在 M6 后续接入。</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="k">今日订单</div>
                <div class="v">—</div>
            </div>
            <div class="stat">
                <div class="k">待发货</div>
                <div class="v">—</div>
            </div>
            <div class="stat">
                <div class="k">在售商品</div>
                <div class="v">—</div>
            </div>
            <div class="stat">
                <div class="k">注册用户</div>
                <div class="v">—</div>
            </div>
        </div>

        <div class="panel pad mt-24">
            <h3>后台进度</h3>
            <p class="muted mt-8">
                已完成后台登录、验证码、会话隔离、退出，分类管理（列表 / 新增 / 编辑 / 删除），
                商品管理（SPU 列表 / 表单、SKU 管理、图片上传），订单管理（列表 / 详情 / 发货 / 改收货信息 / 删除），
                以及用户管理（列表 / 详情 / 编辑 / 禁用 / 重置密码）。
                售后与操作日志页面将在 M6 后续接入。
            </p>
            <div class="row mt-16">
                <a class="btn" th:href="@{/admin/category}">分类管理</a>
                <a class="btn" th:href="@{/admin/product}">商品管理</a>
                <a class="btn" th:href="@{/}">返回前台</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
