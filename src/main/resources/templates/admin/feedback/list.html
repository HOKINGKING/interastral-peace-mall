<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/head :: head(${pageTitle})}"></head>
<body class="admin">
<div th:replace="~{admin/fragments/side :: side('feedback')}"></div>

<div class="admin-main">
    <div th:replace="~{admin/fragments/top :: top('投诉与反馈')}"></div>

    <div class="admin-body">
        <div class="page-title">
            <div>
                <h1>投诉与反馈</h1>
                <p>待处理优先；受理后状态转「处理中」，回复后等用户确认，或由你直接关闭</p>
            </div>
        </div>

        <div class="panel pad mb-16" th:if="${listMessage != null}" th:text="${listMessage}">提示</div>

        <div class="panel pad-sm mb-16">
            <form class="row wrap" method="get" th:action="@{/admin/feedback}" style="gap:8px">
                <select class="select" name="type" style="width:110px;height:32px">
                    <option value="">全部类型</option>
                    <option value="COMPLAINT" th:selected="${type == 'COMPLAINT'}">投诉</option>
                    <option value="FEEDBACK" th:selected="${type == 'FEEDBACK'}">反馈</option>
                </select>
                <select class="select" name="status" style="width:120px;height:32px">
                    <option value="">全部状态</option>
                    <option value="PENDING" th:selected="${status == 'PENDING'}">待处理</option>
                    <option value="PROCESSING" th:selected="${status == 'PROCESSING'}">处理中</option>
                    <option value="REPLIED" th:selected="${status == 'REPLIED'}">已回复</option>
                    <option value="CLOSED" th:selected="${status == 'CLOSED'}">已关闭</option>
                </select>
                <input class="input" style="width:150px;height:32px" type="search" name="orderNo"
                       th:value="${orderNo}" placeholder="订单号" maxlength="32">
                <input class="input" style="width:140px;height:32px" type="search" name="username"
                       th:value="${username}" placeholder="用户名 / 昵称" maxlength="20">
                <input class="input" style="width:150px;height:32px" type="date" name="dateFrom"
                       th:value="${dateFrom}" title="开始日期">
                <span class="small muted">至</span>
                <input class="input" style="width:150px;height:32px" type="date" name="dateTo"
                       th:value="${dateTo}" title="结束日期">
                <button class="btn btn-sm" type="submit">查询</button>
                <a class="btn btn-sm" th:href="@{/admin/feedback}">重置</a>
                <span style="flex:1"></span>
                <span class="small muted" th:text="|共 ${total} 条|">共 0 条</span>
            </form>
        </div>

        <div class="panel">
            <table class="table" th:if="${!#lists.isEmpty(feedbacks)}">
                <thead>
                <tr>
                    <th>类型</th>
                    <th>用户</th>
                    <th>关联订单</th>
                    <th>内容摘要</th>
                    <th>状态</th>
                    <th>提交时间</th>
                    <th class="right">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${feedbacks}">
                    <td>
                        <span class="badge" th:classappend="${f.type == 'COMPLAINT'} ? 'badge-danger' : 'badge'"
                              th:text="${f.typeDesc}">投诉</span>
                    </td>
                    <td>
                        <span th:text="${f.displayName}">星野</span>
                        <div class="small muted mono" th:if="${f.username != null}" th:text="|@${f.username}|">@xingye</div>
                    </td>
                    <td class="small mono">
                        <a th:if="${f.orderId != null}" th:href="@{/admin/order/{id}(id=${f.orderId})}"
                           th:text="${f.orderNo != null ? f.orderNo : '订单已删除'}">20261116102133</a>
                        <span class="muted" th:if="${f.orderId == null}">—</span>
                    </td>
                    <td th:text="${f.contentPreview}">内容摘要</td>
                    <td>
                        <span class="badge" th:classappend="${f.statusClass}" th:text="${f.statusDesc}">待处理</span>
                        <span class="badge badge-completed" th:if="${f.replied}">已回复</span>
                    </td>
                    <td class="small muted" th:text="${f.createTimeText}">2026-11-27 13:00</td>
                    <td class="right">
                        <a class="btn btn-sm" th:href="@{/admin/feedback/{id}(id=${f.id})}">处理</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="empty" th:if="${#lists.isEmpty(feedbacks)}">
                <div class="icon">💬</div>
                <div>没有匹配的投诉或反馈</div>
                <div class="small muted mt-8">换个筛选条件试试</div>
            </div>
        </div>

        <div th:replace="~{front/fragments/pagination :: pager(${pagination})}"></div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
