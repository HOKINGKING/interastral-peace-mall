<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{front/fragments/header :: header('order')}"></div>

<main>
    <section class="page">
        <div class="container">
            <div class="breadcrumb">
                <a th:href="@{/}">首页</a>
                <span class="sep">›</span>
                <span>我的订单</span>
            </div>

            <div class="panel pad mb-16" th:if="${listMessage != null}" th:text="${listMessage}">提示</div>

            <div class="panel mb-16" style="padding:0 8px">
                <div class="tabs">
                    <a th:each="tab : ${tabs}" th:href="${tab.url}"
                       th:classappend="${tab.active} ? 'active' : ''" th:text="${tab.label}">全部</a>
                </div>
            </div>

            <div class="between mb-16">
                <h2 style="font-size:17px">我的订单</h2>
                <span class="small muted" th:text="|共 ${total} 笔|">共 0 笔</span>
            </div>

            <div class="panel empty" th:if="${#lists.isEmpty(orders)}">
                <div class="icon">🧾</div>
                <div>这里还没有订单</div>
                <div class="small muted mt-8">挑几件喜欢的商品，下单后就能在这里看到</div>
                <a class="btn btn-sm btn-primary mt-16" th:href="@{/product/list}">去逛逛</a>
            </div>

            <div class="order-card" th:each="o : ${orders}" th:attr="data-order-id=${o.id}">
                <div class="order-head">
                    <div>
                        <span class="no mono" th:text="${o.orderNo}">20261117201501</span>
                        <span style="margin-left:12px" th:text="${o.createTimeText}">2026-11-17 20:15</span>
                        <span style="margin-left:12px" th:if="${o.trackingNo != null}"
                              th:text="|${o.courierCompany} · ${o.trackingNo}|">物流</span>
                    </div>
                    <div>
                        <span class="badge" th:classappend="${o.statusClass}" th:text="${o.statusDesc}">已支付</span>
                    </div>
                </div>
                <div class="order-body">
                    <div class="thumb ph alt-4" th:if="${o.firstProductImage == null or o.firstProductImage == ''}"
                         th:text="${#strings.substring(o.firstProductName != null ? o.firstProductName : '?', 0, 1)}">星</div>
                    <img class="thumb" th:if="${o.firstProductImage != null and o.firstProductImage != ''}"
                         th:src="${o.firstProductImage}" th:alt="${o.firstProductName}"
                         style="object-fit:cover;border-radius:8px">
                    <div style="flex:1;min-width:0">
                        <a style="font-weight:600" th:href="@{/order/{id}(id=${o.id})}"
                           th:text="${o.firstProductName}">商品名</a>
                        <div class="small muted" th:text="|共 ${o.totalQuantity} 件商品|">共 1 件商品</div>
                    </div>
                    <div class="right">
                        <div style="font-weight:700;color:var(--danger)" th:text="|¥${o.totalAmountText}|">¥0.00</div>
                        <div class="small muted">含运费 ¥0.00</div>
                    </div>
                </div>
                <div class="order-foot">
                    <div class="small muted">
                        <span th:if="${o.status == 'PENDING_PAYMENT'}">下单后请尽快支付，超过 30 分钟将自动取消</span>
                        <span th:if="${o.status == 'PAID'}">卖家备货中，请耐心等待发货</span>
                        <span th:if="${o.status == 'SHIPPED'}">卖家已发货，注意查收</span>
                        <span th:if="${o.status == 'COMPLETED'}">交易已完成，感谢你的购买</span>
                        <span th:if="${o.status == 'CANCELLED'}">订单已取消，库存已回补</span>
                    </div>
                    <div class="row wrap" style="gap:8px">
                        <a class="btn btn-sm" th:href="@{/order/{id}(id=${o.id})}">查看详情</a>
                        <a class="btn btn-sm btn-primary" th:if="${o.canPay}"
                           th:href="@{/order/{id}/pay(id=${o.id})}">去支付</a>
                        <form th:if="${o.canCancel}" th:action="@{/order/{id}/cancel(id=${o.id})}"
                              method="post" style="margin:0">
                            <button class="btn btn-sm" type="submit"
                                    data-confirm="取消后库存会回补，确定取消这笔订单吗？">取消订单</button>
                        </form>
                        <form th:if="${o.canReceive}" th:action="@{/order/{id}/receive(id=${o.id})}"
                              method="post" style="margin:0">
                            <button class="btn btn-sm btn-primary" type="submit"
                                    data-confirm="请确认已收到商品，确认后交易完成。">确认收货</button>
                        </form>
                        <a class="btn btn-sm" th:if="${o.canComplaint}"
                           th:href="@{/feedback/form(orderId=${o.id})}"
                           data-pending="投诉与反馈模块将在下一里程碑（M7）接入">投诉</a>
                        <button class="btn btn-sm btn-danger" type="button" th:if="${o.canDelete}"
                                th:attr="data-delete-order=${o.id}">删除订单</button>
                    </div>
                </div>
            </div>

            <div th:replace="~{front/fragments/pagination :: pager(${pagination})}"></div>
        </div>
    </section>
</main>

<div th:replace="~{front/fragments/footer :: footer}"></div>
<script th:src="@{/js/order.js}"></script>
</body>
</html>
