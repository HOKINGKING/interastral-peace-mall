<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(active)" class="site-header">
    <div class="corp-strip">
        <div class="container">
            <span>星际和平公司 · 传统项目部</span>
            <span>以信用点（Credit）结算 · 全星系 48 小时直达</span>
        </div>
    </div>

    <div class="container">
        <div class="brand-row">
            <a class="brand" th:href="@{/}">
                <span class="mark brand-mark">
                    <img class="ipc-logo" th:src="@{/img/ipc-logo-light.png}" alt="星际和平公司标识">
                </span>
                <span class="wm">
                    <b>星际和平商城</b>
                    <i>INTERASTRAL PEACE MALL</i>
                </span>
            </a>

            <form class="search" th:action="@{/search}" method="get" role="search">
                <input type="search" name="keyword" maxlength="50"
                       placeholder="搜索商品，如「水杯」「徽章」"
                       th:value="${param.keyword != null ? param.keyword[0] : ''}">
                <button type="submit">搜索</button>
            </form>

            <div class="header-actions" th:if="${session.LOGIN_ACCOUNT == null}">
                <a th:href="@{/cart}" data-pending="购物车模块将在下一里程碑（M5）接入">购物车</a>
                <a th:href="@{/login}">登录</a>
                <a th:href="@{/register}">注册</a>
            </div>
            <div class="header-actions" th:if="${session.LOGIN_ACCOUNT != null}">
                <a th:href="@{/user/center}" th:text="|你好，${session.LOGIN_ACCOUNT.displayName}|">你好</a>
                <a th:href="@{/order/list}" data-pending="订单模块将在下一里程碑（M5）接入">我的订单</a>
                <a th:href="@{/cart}" data-pending="购物车模块将在下一里程碑（M5）接入">购物车</a>
                <form class="inline-form" th:action="@{/user/logout}" method="post">
                    <button class="link-btn" type="submit">退出</button>
                </form>
            </div>
        </div>

        <nav class="nav">
            <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active' : ''">首页</a>
            <th:block th:if="${navGroups != null}">
                <a th:each="group : ${navGroups}"
                   th:href="@{/category/{id}(id=${group.root.id})}"
                   th:classappend="${active == 'category-' + group.root.id} ? 'active' : ''"
                   th:text="${group.root.name}">分类</a>
            </th:block>
            <a th:href="@{/product/list}" th:classappend="${active == 'list'} ? 'active' : ''">全部商品</a>
        </nav>
    </div>
</header>
</body>
</html>
