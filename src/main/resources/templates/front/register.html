<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/head :: head('注册')}"></head>
<body>
<div th:replace="~{front/fragments/header :: header('register')}"></div>

<main>
    <section class="auth-wrap">
        <div class="auth-card">
            <h2>注册</h2>
            <p class="muted small mb-24">创建账号，开始你的第一次下单</p>

            <form th:action="@{/user/register}" th:object="${registerForm}" method="post" novalidate data-auth-form>
                <div class="auth-alert error" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>
                <div class="field">
                    <label for="username">用户名<span class="req">*</span></label>
                    <input class="input" id="username" th:field="*{username}"
                           placeholder="4–20 位字母、数字或下划线" autocomplete="username">
                    <div class="help">登录后不可修改</div>
                    <div class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="field">
                    <label for="password">密码<span class="req">*</span></label>
                    <input class="input" id="password" type="password" th:field="*{password}"
                           placeholder="6–20 位，需包含字母和数字" autocomplete="new-password">
                    <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="field">
                    <label for="confirmPassword">确认密码<span class="req">*</span></label>
                    <input class="input" id="confirmPassword" type="password" th:field="*{confirmPassword}"
                           placeholder="再次输入密码" autocomplete="new-password">
                    <div class="error-text" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <div class="field">
                    <label for="phone">手机号</label>
                    <input class="input" id="phone" th:field="*{phone}" placeholder="选填，11 位手机号"
                           autocomplete="tel">
                    <div class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="field">
                    <label for="captcha">图形验证码<span class="req">*</span></label>
                    <div class="row" style="gap:10px">
                        <input class="input" id="captcha" th:field="*{captcha}" placeholder="请输入右侧 4 位字符"
                               autocomplete="off" style="flex:1">
                        <img class="captcha-img" th:src="@{/captcha}" alt="图形验证码" title="点击刷新">
                    </div>
                    <div class="help">不区分大小写，5 分钟内有效，校验后立即失效</div>
                    <div class="error-text" th:if="${#fields.hasErrors('captcha')}" th:errors="*{captcha}"></div>
                </div>

                <button class="btn btn-primary btn-block" type="submit" style="height:42px">注册</button>
            </form>

            <div class="small muted center mt-16">
                已有账号？<a th:href="@{/login}" style="color:var(--brand)">去登录</a>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{front/fragments/footer :: footer}"></div>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
