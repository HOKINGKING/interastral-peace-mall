<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/head :: head('修改密码')}"></head>
<body>
<div th:replace="~{front/fragments/header :: header('center')}"></div>

<main class="container page">
    <div class="page-title">
        <div>
            <h1>修改密码</h1>
            <p>修改成功后需要重新登录</p>
        </div>
        <a class="btn" th:href="@{/user/center}">返回个人中心</a>
    </div>

    <section class="panel pad" style="max-width:560px">
        <div class="auth-alert error hide" data-error-for="global"></div>
        <form th:action="@{/user/password}" th:object="${changePasswordForm}" method="post" novalidate
              data-password-form>
            <div class="auth-alert error" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>
            <div class="field">
                <label for="oldPassword">原密码<span class="req">*</span></label>
                <input class="input" id="oldPassword" type="password" th:field="*{oldPassword}"
                       placeholder="请输入当前密码" autocomplete="current-password">
                <div class="error-text" data-error-for="oldPassword">
                    <span th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></span>
                </div>
            </div>

            <div class="field">
                <label for="newPassword">新密码<span class="req">*</span></label>
                <input class="input" id="newPassword" type="password" th:field="*{newPassword}"
                       placeholder="6–20 位，需包含字母和数字" autocomplete="new-password">
                <div class="error-text" data-error-for="newPassword">
                    <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">确认新密码<span class="req">*</span></label>
                <input class="input" id="confirmPassword" type="password" th:field="*{confirmPassword}"
                       placeholder="再次输入新密码" autocomplete="new-password">
                <div class="error-text" data-error-for="confirmPassword">
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </div>
            </div>

            <button class="btn btn-primary" type="submit" data-password-submit>保存并重新登录</button>
            <p class="help mt-8">修改成功后当前会话会失效，需要用新密码重新登录。</p>
        </form>
    </section>
</main>

<div th:replace="~{front/fragments/footer :: footer}"></div>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/password.js}"></script>
</body>
</html>
