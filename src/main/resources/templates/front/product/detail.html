<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{front/fragments/head :: head(${detail.product.name})}"></head>
<body>
<div th:replace="~{front/fragments/header :: header(${activeNav})}"></div>

<main>
    <section class="page">
        <div class="container">
            <div class="breadcrumb">
                <a th:href="@{/}">首页</a>
                <span class="sep">›</span>
                <th:block th:if="${detail.parentCategory != null}">
                    <a th:href="@{/category/{id}(id=${detail.parentCategory.id})}"
                       th:text="${detail.parentCategory.name}">一级分类</a>
                    <span class="sep">›</span>
                </th:block>
                <a th:if="${detail.category != null}"
                   th:href="@{/category/{id}(id=${detail.category.id})}"
                   th:text="${detail.category.name}">二级分类</a>
                <span th:if="${detail.category != null}" class="sep">›</span>
                <span th:text="${detail.product.name}">商品名</span>
            </div>

            <div class="panel pad">
                <div class="row" style="align-items:flex-start;gap:32px">
                    <div style="flex:1;min-width:320px">
                        <div class="detail-gallery" data-gallery>
                            <div class="detail-main-img ph" th:if="${detail.images.isEmpty()}">
                                <span th:text="${#strings.substring(detail.product.name, 0, 1)}">星</span>
                            </div>
                            <div class="detail-main-img" th:if="${!detail.images.isEmpty()}">
                                <img id="mainImage" th:src="${detail.images[0]}" th:alt="${detail.product.name}">
                            </div>
                            <div class="detail-thumbs" th:if="${detail.images.size() > 1}">
                                <img th:each="image, stat : ${detail.images}" class="detail-thumb" data-thumb
                                     th:src="${image}" th:alt="|${detail.product.name} 图 ${stat.count}|"
                                     th:attr="data-full=${image}" th:classappend="${stat.first} ? 'active' : ''">
                            </div>
                        </div>
                    </div>

                    <div style="flex:1;min-width:320px">
                        <h1 style="font-size:22px">
                            <span th:text="${detail.product.name}">商品名</span>
                            <span class="seal detail-seal">IPC 认证正品</span>
                        </h1>
                        <p class="muted small mt-8" th:if="${detail.product.brand != null or detail.product.descn != null}">
                            <span th:if="${detail.product.brand != null}" th:text="${detail.product.brand}">品牌</span>
                            <span th:if="${detail.product.brand != null and detail.product.descn != null}"> · </span>
                            <span th:if="${detail.product.descn != null}" th:text="${detail.product.descn}">短描述</span>
                        </p>

                        <div class="mt-16 price-box">
                            <div class="price-line">
                                <small>¥</small><span id="skuPrice"
                                    th:text="${#numbers.formatDecimal(detail.defaultSku != null ? detail.defaultSku.price : detail.minPrice, 1, 2)}">0.00</span>
                            </div>
                            <div class="small muted mt-8">
                                当前规格库存 <b id="skuStock"
                                    th:text="${detail.defaultSku != null ? detail.defaultSku.stock : 0}">0</b> 件
                                · 总库存 <b th:text="${detail.totalStock}">0</b> 件
                                · 已售 <span th:text="${detail.product.sales != null ? detail.product.sales : 0}">0</span> 件
                            </div>
                            <div class="small mt-8" style="color:var(--danger)" th:if="${detail.offSale}">
                                该商品已下架，暂不可购买
                            </div>
                            <div class="small mt-8" style="color:var(--danger)"
                                 th:if="${!detail.offSale and detail.soldOut}">
                                该商品已售罄
                            </div>
                        </div>

                        <div class="mt-24" th:if="${!detail.skus.isEmpty()}">
                            <div class="small muted mb-8">规格</div>
                            <div class="sku-list">
                                <button type="button" class="sku" th:each="sku : ${detail.skus}"
                                        data-sku
                                        th:attr="data-id=${sku.id},data-price=${sku.priceText},data-stock=${sku.stock},data-spec=${sku.spec}"
                                        th:classappend="${(detail.defaultSku != null and detail.defaultSku.id == sku.id ? 'active ' : '') + (sku.soldOut ? 'is-out' : '')}">
                                    <span th:text="${sku.spec}">规格</span>
                                    <span th:if="${sku.soldOut}">（缺货）</span>
                                </button>
                            </div>
                        </div>

                        <div class="mt-24 row" th:if="${detail.maxQty > 0}">
                            <div class="qty" id="qtyBox" data-qty data-min="1" th:attr="data-max=${detail.maxQty}">
                                <button type="button" data-dec>−</button>
                                <input id="qtyInput" value="1" readonly>
                                <button type="button" data-inc>+</button>
                            </div>
                            <span class="small muted" th:text="|单次最多 ${detail.maxQty} 件|">单次最多 99 件</span>
                        </div>
                        <div class="mt-24 row" th:if="${detail.maxQty <= 0}">
                            <span class="small muted">该规格暂无库存，无法加购</span>
                        </div>

                        <!-- 售罄 / 下架：按钮禁用，不提供加购入口 -->
                        <div class="mt-24 row" th:if="${detail.offSale or detail.soldOut or detail.defaultSku == null}">
                            <button class="btn btn-primary is-disabled" type="button" disabled>加入购物车</button>
                            <button class="btn is-disabled" type="button" disabled>立即购买</button>
                        </div>

                        <div class="mt-24" th:unless="${detail.offSale or detail.soldOut or detail.defaultSku == null}">
                            <!-- 游客：跳登录并带回当前商品（AC-04） -->
                            <div class="row" th:if="${session.LOGIN_ACCOUNT == null}">
                                <a class="btn btn-primary" style="height:44px;padding:0 28px"
                                   th:href="@{/login(redirect=${'/product/' + detail.product.id})}">加入购物车</a>
                                <a class="btn" style="height:44px;padding:0 28px"
                                   th:href="@{/login(redirect=${'/product/' + detail.product.id})}">立即购买</a>
                            </div>
                            <!-- 已登录：加购由 static/js/cart.js 用 fetch 提交，失败信息走统一 Result -->
                            <form class="row" th:if="${session.LOGIN_ACCOUNT != null}" method="post"
                                  th:action="@{/cart/add}">
                                <input type="hidden" name="itemId" id="cartItemId"
                                       th:value="${detail.defaultSku.id}">
                                <input type="hidden" name="quantity" class="js-qty-target" value="1">
                                <button class="btn btn-primary" type="submit"
                                        style="height:44px;padding:0 28px">加入购物车</button>
                                <button class="btn" type="submit" th:formaction="@{/order/checkout}" formmethod="get"
                                        style="height:44px;padding:0 28px">立即购买</button>
                            </form>
                        </div>

                        <div class="mt-24 small muted service-strip">
                            正品保障 · 48 小时内发货 · 7 天无理由退货 · 支持开具电子发票
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel pad mt-16" th:if="${!detail.specs.isEmpty()}">
                <h3 style="font-size:16px;margin-bottom:12px">商品参数</h3>
                <table class="spec-table">
                    <tr th:each="spec : ${detail.specs}">
                        <th th:text="${spec.key}">参数名</th>
                        <td th:text="${spec.value}">参数值</td>
                    </tr>
                </table>
            </div>

            <div class="panel pad mt-16"
                 th:if="${detail.product.detail != null and !#strings.isEmpty(detail.product.detail)}">
                <h3 style="font-size:16px;margin-bottom:12px">商品详情</h3>
                <p class="muted" style="white-space:pre-line" th:text="${detail.product.detail}">详情</p>
            </div>

            <div class="mt-24" th:if="${!detail.related.isEmpty()}">
                <div class="between mb-16">
                    <h2 style="font-size:18px">看了又看</h2>
                    <a class="small muted" th:href="@{/product/list}">更多 →</a>
                </div>
                <div class="grid-products">
                    <th:block th:each="p : ${detail.related}">
                        <a th:replace="~{front/fragments/product :: card(${p})}"></a>
                    </th:block>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{front/fragments/footer :: footer}"></div>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
