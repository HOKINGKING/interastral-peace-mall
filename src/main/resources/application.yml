server:
  port: 8080
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: interastral-peace-mall

  # ---------- 数据源：先在 Navicat 里执行 db/init.sql 建库 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/interastral_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: "123456"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # ---------- Thymeleaf ----------
  thymeleaf:
    cache: false          # 开发期关闭缓存，改模板不用重启
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  # mapper 接口所在的包，配合启动类 @MapperScan 使用
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ipc.mall.entity
  configuration:
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，联调和答辩演示都好用；上线请删掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 本项目【不做逻辑删除】，数据库也没有 deleted 列：
      # 商品用 status(DRAFT/ON_SALE) 上下架代替删除，订单用 status(CANCELLED) 取消，
      # 外键 ON DELETE RESTRICT 兜底。若误配 logic-delete-field，MyBatis-Plus 会在
      # 每条 SQL 后面拼 deleted=0，直接报 Unknown column 'deleted'。
      # logic-delete-field: deleted   ← 不要打开

# 自定义配置：图片上传目录
mall:
  upload:
    path: ./uploads/
    access-path: /uploads/**

logging:
  level:
    root: info
    com.ipc.mall: debug
